<section class="projects" id="proyectos">
  <div class="projects__inner">
    <app-section-title title="Proyectos que acompañamos" align="center" />

    <div class="tabs" role="tablist" aria-label="Filtros de proyectos">
      @for (tab of tabs; track tab.id) {
        <button
          type="button"
          role="tab"
          class="tab"
          [class.tab--active]="tab.id === activeTab()"
          [attr.aria-selected]="tab.id === activeTab()"
          (click)="selectTab(tab.id)"
        >
          {{ tab.label }}
        </button>
      }
    </div>

    <div class="cards-row">
      @for (project of visible(); track project.id) {
        <app-project-card [project]="project" />
      } @empty {
        <p class="projects__empty">Todavía no hay proyectos en esta categoría.</p>
      }
    </div>

    @if (pageCount() > 1) {
      <div class="dots" aria-label="Paginación de proyectos">
        @for (pageIndex of pages(); track pageIndex) {
          <button
            type="button"
            class="dot"
            [class.dot--active]="pageIndex === page()"
            [attr.aria-current]="pageIndex === page() ? 'true' : null"
            (click)="selectPage(pageIndex)"
          >
            <span class="visually-hidden">Página {{ pageIndex + 1 }}</span>
          </button>
        }
      </div>
    }
  </div>
</section>
