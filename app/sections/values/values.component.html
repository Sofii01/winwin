<section class="values" id="valores">

  <div class="values__inner">

    <app-section-title
      title="Los valores que nos impulsan en cada proyecto"
      description="Adoptamos 6 principios que definen cómo pensamos, actuamos y nos relacionamos con nuestros creadores, voluntarios, inversores y comunidad."
      align="center"
    />

    <div class="values-grid">

      @for (value of values; track value.id) {

        <article class="value-card">

          <h3>{{ value.title }}</h3>

          <p>{{ value.description }}</p>

        </article>

      }

    </div>

  </div>

</section>
