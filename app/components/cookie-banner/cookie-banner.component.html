@if (visible()) {
  <div class="cookie-banner" role="dialog" aria-live="polite" aria-label="Aviso de cookies">
    <p class="cookie-banner__text">
      Usamos cookies propias y de terceros para mejorar tu experiencia y entender cómo se usan los
      proyectos de la plataforma.
      <a href="#legal">Ver política de cookies</a>
    </p>

    <div class="cookie-banner__actions">
      <button type="button" class="btn btn--outline btn--sm" (click)="reject()">Rechazar</button>
      <button type="button" class="btn btn--primary btn--sm" (click)="accept()">Aceptar</button>
    </div>
  </div>
}
