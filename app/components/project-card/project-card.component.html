<article class="project-card">
  <span class="project-card__tag">{{ project().tag }}</span>

  <div class="project-card__image">
    @if (imageOk()) {
      <img [src]="project().image" [alt]="project().title" loading="lazy" (error)="onImageError()" />
    }
  </div>

  <h3 class="project-card__title">{{ project().title }}</h3>
  <p class="project-card__desc">{{ project().description }}</p>

  <div
    class="progress"
    role="progressbar"
    [attr.aria-valuenow]="progress()"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-label]="'Avance de ' + project().title"
  >
    <div class="progress__bar" [style.width.%]="progress()"></div>
  </div>

  <div class="project-card__stats">
    <span class="raised">$ {{ project().raised | number: '1.0-0' }} recaudados</span>
    <span class="goal">{{ progress() }}% de $ {{ project().goal | number: '1.0-0' }}</span>
  </div>

  <hr />

  <div class="project-card__meta">
    <span>{{ project().investors }} inversores</span>
    <span>{{ project().daysLeft }} días restantes</span>
  </div>
</article>
