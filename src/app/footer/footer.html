<footer class="footer">
  <div class="footer__inner">
    <div class="footer__top">
      <div class="footer__brand">
        <a routerLink="/" class="footer__logo" aria-label="WinWin Dream - Inicio">
          <img src="assests/Logo.jpg" alt="WinWin Dream" class="footer__logo-image">
        </a>
        <p class="footer__tagline">Conectando personas, impulsando sueños.</p>

        <div class="footer__social">
          <a href="#" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
            </svg>
          </a>
          <a href="#" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
              <rect x="2" y="9" width="4" height="12" />
              <circle cx="4" cy="4" r="2" />
            </svg>
          </a>
          <a href="mailto:winwin.dream.contacto@gmail.com" aria-label="Correo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
          </a>
        </div>
      </div>

      @for (column of columns; track column.title) {
        <nav class="footer__column" [attr.aria-label]="column.title">
          <h2>{{ column.title }}</h2>
          <ul>
            @for (link of column.links; track link.label) {
              <li>
                <a [routerLink]="link.path" [fragment]="link.fragment">{{ link.label }}</a>
              </li>
            }
          </ul>
        </nav>
      }
    </div>

    <hr class="footer__divider">

    <p class="footer__copy">© 2026 WinWinDream. Todos los derechos reservados.</p>
  </div>
</footer>
