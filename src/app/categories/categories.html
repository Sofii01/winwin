<section class="categories">
  <h2>Puedes colaborar en proyectos de tipo</h2>

  <div
    class="categories__banner"
    [style.backgroundImage]="'url(' + categories[activePage].image + ')'"
  >
    <div class="categories__scrim" aria-hidden="true"></div>
    <div class="categories__content">
      <span class="eyebrow eyebrow--light">Categorías de WinWin Dream</span>
      <h3>{{ categories[activePage].title }}</h3>
      <p>{{ categories[activePage].description }}</p>
    </div>

    <div class="dots dots--overlay" role="tablist" aria-label="Paginación de categorías">
      @for (dot of pageDots; track dot) {
        <button
          type="button"
          class="dot"
          [class.dot--active]="dot === activePage"
          [attr.aria-label]="categories[dot].title"
          (click)="selectPage(dot)"
        ></button>
      }
    </div>
  </div>
</section>
